<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Lyrics</title>
<style>
  /*
    URL options (combine with &):
      ?theme=light          light background, dark text
      ?bg=transparent       transparent background (for OBS / video overlays)
      ?bg=00ff00            any hex background color (e.g. green screen)
      ?color=ffffff         text color
      ?align=bottom         put lyrics at the bottom (lower-third style)
      ?font=serif           serif typeface
      ?max=72               largest font size in px (text shrinks to fit)
  */
  :root { --bg: #111; --fg: #f5f5f5; --muted: rgba(245,245,245,.45); --max: 64px; }
  body.light { --bg: #fafaf7; --fg: #1a1a1a; --muted: rgba(26,26,26,.45); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: max(4vh, env(safe-area-inset-top)) 5vw max(4vh, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  body.bottom { justify-content: flex-end; }
  body.serif { font-family: Georgia, "Times New Roman", serif; }
  #stage { flex: 0 1 auto; max-height: 100%; display: flex; flex-direction: column; gap: 1.2em; }
  #current {
    font-size: var(--max); font-weight: 600; line-height: 1.3; text-align: center;
    white-space: pre-line; overflow-wrap: break-word;
    transition: opacity .25s ease;
  }
  body.transparent #current { text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #next {
    color: var(--muted); text-align: center; white-space: pre-line;
    border-top: 1px solid var(--muted); padding-top: .8em;
  }
  #next:empty { display: none; }
  #idle { text-align: center; color: var(--muted); font-size: 20px; display: none; }
  body.idle #idle { display: block; }
  body.idle #stage { display: none; }
  .fading { opacity: 0; }
  #status {
    position: fixed; right: 12px; bottom: 10px; font: 12px system-ui, sans-serif;
    color: var(--muted); display: flex; align-items: center; gap: 6px;
  }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #c33; }
  #status.ok, body.idle #status { display: none; }
  body.transparent #status { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="current"></div>
    <div id="next"></div>
  </div>
  <div id="idle">Lyrics will appear here during worship.</div>
  <div id="status">Connecting…</div>

<script>
  const q = new URLSearchParams(location.search);
  const body = document.body, root = document.documentElement.style;
  if (q.get('theme') === 'light') body.classList.add('light');
  if (q.get('align') === 'bottom') body.classList.add('bottom');
  if (q.get('font') === 'serif') body.classList.add('serif');
  const bg = q.get('bg');
  if (bg === 'transparent') { body.classList.add('transparent'); root.setProperty('--bg', 'transparent'); }
  else if (bg) root.setProperty('--bg', '#' + bg.replace('#', ''));
  if (q.get('color')) root.setProperty('--fg', '#' + q.get('color').replace('#', ''));
  const MAX = Number(q.get('max')) || null;

  const cur = document.getElementById('current');
  const nxt = document.getElementById('next');
  const status = document.getElementById('status');
  let shown = null;

  // Shrink the font until the slide fits on screen, starting from the max size.
  function fit() {
    const max = MAX || Math.min(64, Math.max(28, window.innerWidth / 14));
    const avail = window.innerHeight * 0.9;
    let size = max;
    const set = s => { cur.style.fontSize = s + 'px'; nxt.style.fontSize = Math.max(12, s * 0.45) + 'px'; };
    set(size);
    while (size > 14 && (document.getElementById('stage').scrollHeight > avail ||
                         cur.scrollWidth > cur.clientWidth + 1)) {
      size -= 2;
      set(size);
    }
  }

  function show(data) {
    status.className = data.connected ? 'ok' : '';
    status.textContent = data.connected ? '' : 'Waiting for lyrics…';
    body.classList.toggle('idle', !data.connected);
    if (!data.connected) data = { ...data, current: '', next: '' };
    if (data.current === shown && nxt.textContent === (data.next || '')) return;
    shown = data.current;
    cur.classList.add('fading');
    setTimeout(() => {
      cur.textContent = data.current || '';
      nxt.textContent = data.next || '';
      fit();
      cur.classList.remove('fading');
    }, 150);
  }

  function connect() {
    const es = new EventSource('events'); // relative, so it also works inside an embed
    es.onmessage = e => show(JSON.parse(e.data));
    es.onerror = () => {
      status.className = '';
      status.textContent = 'Reconnecting…';
    };
  }

  window.addEventListener('resize', fit);
  connect();
</script>
</body>
</html>
